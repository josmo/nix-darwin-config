# Lima template for the coding-agent base VM. sandbox.sh provisions it once,
# then clones it per directory. Mounts are set on each clone, never here.
minimumLimaVersion: 2.0.0
base:
  - template:_images/ubuntu-lts
vmType: vz
cpus: 6
memory: 12GiB
mounts: []

# Local Ollama/MLX on the host.
env:
  OLLAMA_HOST: http://host.lima.internal:11434

# Provisioning re-runs on every boot (including each clone's), so every step is
# guarded. Delete the base (`sandbox --rebuild-base`) to pick up new agent versions.
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      export DEBIAN_FRONTEND=noninteractive
      if ! command -v node >/dev/null; then
        curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
        apt-get install -y nodejs git ripgrep jq tmux build-essential
      fi
      command -v claude >/dev/null || npm install -g @anthropic-ai/claude-code
      command -v gemini >/dev/null || npm install -g @google/gemini-cli
      command -v opencode >/dev/null || npm install -g opencode-ai
      [ -e /nix ] || curl --proto "=https" --tlsv1.2 -sSf -L https://install.determinate.systems/nix | sh -s -- install --no-confirm

probes:
  - mode: readiness
    description: coding agents installed
    script: |
      #!/bin/bash
      set -eux -o pipefail
      if ! timeout 600s bash -c "until command -v claude && command -v gemini && command -v opencode; do sleep 5; done"; then
        echo >&2 "agents are not installed yet"
        exit 1
      fi
    hint: See /var/log/cloud-init-output.log in the guest.
