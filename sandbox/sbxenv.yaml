# The `sandbox` command's shared environment, for `bento env run` (sbx's sbxenv.yaml format); see
# README.md. The script passes the args and layers your own files on top. Host commands
# (`lifecycle`, `command:` secrets) don't go here: they'd ask for approval on every run.
schemaVersion: "1"
agent: ${{ env.args.agent }}
args:
  agent:
    default: claude
  workspace:
    required: true
  # The staged agent config (instructions, subagents, commands), mounted read-only.
  stage:
    required: true
  # SSH public key to sign commits with; empty: commits aren't signed.
  signingKey:
    default: ""
workspace:
  path: ${{ env.args.workspace }}
  clone: true
additionalWorkspaces:
  - path: ${{ env.args.stage }}
    readOnly: true
kits:
  # Nix (flakes), direnv and xz, from smolbento; pinned while it's 0.x.
  - ghcr.io/pelotech/smolbento/kits/nix:0.1.0
  - source: git-signing
    args:
      signingKey: ${{ env.args.signingKey }}
  - source: agent-config
    args:
      AGENT_CONFIG: ${{ env.args.stage }}
env:
  OLLAMA_HOST: http://host.docker.internal:11434
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
