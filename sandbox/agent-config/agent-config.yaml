# syntax=docker/sandbox-kit:3
# Personal agent instructions, subagents and commands for every agent; see ../README.md.
schemaVersion: "3"
kind: mixin
displayName: Agent config
description: Links each agent's instructions, subagents and commands to a read-only host directory.
version: "2.1.0"
provides: [agent-config]

args:
  # The `sandbox` command's staging directory, which it also mounts read-only (`DIR:ro`) at the
  # same path. Empty: nothing is linked.
  AGENT_CONFIG:
    default: ""
    env: AGENT_CONFIG

capabilities:
  # OpenCode's own models (its default, big-pickle), which the balanced policy doesn't allow.
  - type: com.docker.sandbox/network-policy@2
    config:
      runtime:
        allow: [{hosts: [opencode.ai, "*.opencode.ai"]}]

  - type: com.docker.sandbox/lifecycle@1
    config:
      startup:
        - command: |
            set -e
            c=$AGENT_CONFIG h=/home/agent
            [ -n "$c" ] || exit 0
            # link TARGET PATH: point PATH at TARGET, replacing whatever is there.
            link() {
              [ -e "$1" ] || return 0
              mkdir -p "$(dirname "$2")"
              [ -L "$2" ] || rm -rf "$2"
              ln -sfn "$1" "$2"
            }
            link $c/AGENTS.md $h/.claude/CLAUDE.md
            link $c/AGENTS.md $h/.config/opencode/AGENTS.md
            link $c/AGENTS.md $h/.codex/AGENTS.md
            link $c/AGENTS.md $h/.gemini/GEMINI.md
            link $c/AGENTS.md $h/.copilot/copilot-instructions.md
            for a in claude opencode; do
              d=$h/.$a; [ $a = opencode ] && d=$h/.config/opencode
              link $c/$a/agents $d/agents
              link $c/$a/commands $d/commands
            done
          # Startup steps run as root unless they name a user (smolbento 0.20.1).
          user: agent
          description: Link agent instructions, subagents and commands
